[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lowstruct"
version = "0.0.1"
description = "Parser for lowstruct (.lows), a strict configuration format in Lowent surface syntax"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
keywords = ["lowstruct", "config", "configuration", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/rubidus-api/lowstruct"
Documentation = "https://github.com/rubidus-api/lowstruct/blob/main/manual/python.md"
Issues = "https://github.com/rubidus-api/lowstruct/issues"

[tool.setuptools]
packages = ["lowstruct"]
