[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lowstruct"
version = "0.1.0"
description = "Parser for lowstruct (.lows), a strict configuration format in Lowent surface syntax"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
packages = ["lowstruct"]
